version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: bd_desarrollo_software
    environment:
      MYSQL_ROOT_PASSWORD: desarrollo_software_1
      MYSQL_DATABASE: desarrollo_software_1
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: