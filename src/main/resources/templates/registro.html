<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSolutions - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-custom {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-in-out;
        }
        .form-control {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
        }
        .form-control:focus {
            background-color: #0f172a;
            color: white;
            border-color: #10b981;
            box-shadow: 0 0 0 0.25rem rgba(16, 185, 129, 0.25);
        }
        .btn-custom {
            background-color: #10b981;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            background-color: #059669;
            transform: translateY(-2px);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card card-custom p-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-success">TechSolutions</h3>
                    <p class="text-secondary">Crea una cuenta nueva</p>
                </div>

                <form id="registroForm">
                    <!-- NUEVO CAMPO: Nombre -->
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="nombre" placeholder="Tu Nombre" required>
                        <label for="nombre" class="text-secondary">Nombre completo</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="correo" placeholder="nombre@ejemplo.com" required>
                        <label for="correo" class="text-secondary">Correo electrónico</label>
                    </div>

                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="clave" placeholder="Contraseña" required minlength="6">
                        <label for="clave" class="text-secondary">Contraseña (Mín. 6)</label>
                    </div>

                    <button type="submit" class="btn btn-custom btn-lg w-100 mb-3" id="btnSubmit">
                        <span id="btnText">Registrar cuenta</span>
                        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    </button>

                    <div class="text-center">
                        <small class="text-secondary">¿Ya tienes cuenta? <a href="/login" class="text-success text-decoration-none">Inicia sesión</a></small>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.all.min.js"></script>
<script>
    document.getElementById('registroForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const btn = document.getElementById('btnSubmit');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        btn.disabled = true;
        btnText.textContent = 'Creando usuario...';
        btnSpinner.classList.remove('d-none');

        // Capturamos el nuevo campo
        const nombre = document.getElementById('nombre').value;
        const correo = document.getElementById('correo').value;
        const clave = document.getElementById('clave').value;

        try {
            const response = await fetch('/api/auth/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // Enviamos el nombre en el JSON
                body: JSON.stringify({ nombre, correo, clave })
            });

            if(response.ok) {
                Swal.fire({
                    icon: 'success',
                    title: '¡Registrado!',
                    text: 'Usuario creado correctamente.',
                    background: '#1e293b',
                    color: '#fff',
                    confirmButtonColor: '#10b981'
                }).then(() => {
                    window.location.href = '/login';
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Oops...',
                    text: 'Hubo un error al registrar el usuario.',
                    background: '#1e293b',
                    color: '#fff',
                    confirmButtonColor: '#ef4444'
                });
            }
        } catch (error) {
            Swal.fire('Error', 'No se pudo conectar con el servidor', 'error');
        } finally {
            btn.disabled = false;
            btnText.textContent = 'Registrar cuenta';
            btnSpinner.classList.add('d-none');
        }
    });
</script>
</body>
</html>
